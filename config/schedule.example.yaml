# ============================================================================
# 课程表示例  格式示例，请按实际课表修改
# ----------------------------------------------------------------------------
# 课程表 = 时间表骨架上的课程填充，含任课教师与「是否录制」勾选。
# 导入方式：手工填写 / CSV / Excel / ClassIsland 导入（策划书附录 B、D）。
# 注意：示例中的课程与教师均为虚构占位，不涉及任何真实学校数据。
# ============================================================================

teachers:
  - { id: teacher_a, name: "教师甲", profile: teacher_a }
  - { id: teacher_b, name: "教师乙", profile: teacher_b }

week_template:
  cycle: "1"            # 1/单周/双周/every
  entries:
    - { day: Mon, period: 1, start: "08:00", end: "08:45", course: "课程一", teacherId: teacher_a, record: true,  room: "教室一" }
    - { day: Mon, period: 2, start: "08:55", end: "09:40", course: "课程一", teacherId: teacher_a, record: true,  merge: true }
    - { day: Mon, period: 3, start: "10:00", end: "10:45", course: "课程二", teacherId: teacher_b, record: false }
    - { day: Tue, period: 1, start: "08:00", end: "08:45", course: "课程二", teacherId: teacher_b, record: true }

    # 条目级单双周：同一天同一节，单周上数学、双周上语文
    - { day: Wed, period: 1, start: "08:00", end: "08:45", course: "课程四", teacherId: teacher_b, record: false, cycle: odd }
    - { day: Wed, period: 1, start: "08:00", end: "08:45", course: "课程五", teacherId: teacher_a, record: false, cycle: even }

weekend_template:
  source: new           # new（新建）| inherit（沿用历史）
  inherit_from: ""      # source=inherit 时填写历史周次或版本号
  entries:
    - { day: Sat, start: "09:00", end: "10:30", course: "课程三", teacherId: teacher_a, record: true }

overrides:
  # 临时调课 / 停课
  - { date: "2025-03-20", action: cancel }
  - { date: "2025-03-21", action: move, target: { day: Mon, start: "08:00", end: "08:45", course: "课程一", teacherId: teacher_a, record: true } }
