# ============================================================================
# 课程表 —— 默认是**空的**，请填上你自己的课，或用 `vca import` 导入。
# ----------------------------------------------------------------------------
# 为什么默认空着：示例课程会让人以为「程序自带课表」，而每所学校的课
# 都不一样。空着启动时程序会明确说「今天没有课」，比假装有课清楚得多。
#
# 怎么填（三个办法，任选）
#   1) 交互界面里选「3 课表管理」→「导入」（推荐）
#   2) 命令行：vca import classisland "C:\...\Default.json"
#   3) 直接改这个文件（格式见下）
#
# 字段说明
#   day        星期，Mon / Tue / Wed / Thu / Fri / Sat / Sun
#   period     第几节，仅用于显示
#   start/end  起止时间 HH:MM，应当落在时间表里 type: class 的时段内
#   course     课程名
#   teacherId  教师 id，对应下面 teachers 里的 id
#   record     这节课要不要录（true / false）—— 不想录的设 false
#   cycle      单双周：every（默认）/ odd（单周）/ even（双周）
#
# 一条长这样（去掉行首的 # 即可启用）：
#   - { day: Mon, period: 1, start: "08:00", end: "08:45", course: "语文", teacherId: t1, record: true }
#
# 单双周排在同一时段是正常用法，程序不会当成冲突：
#   - { day: Wed, period: 1, start: "08:00", end: "08:45", course: "单周课", teacherId: t1, record: true, cycle: odd }
#   - { day: Wed, period: 1, start: "08:00", end: "08:45", course: "双周课", teacherId: t1, record: true, cycle: even }
# ============================================================================

teachers:
  - { id: t1, name: "我的课", profile: default }

week_template:
  cycle: "every"
  entries: []

# 周末课表：source 为 new 表示用下面自己的 entries；想沿用工作日课表就写 source: inherit
weekend_template:
  source: new
  entries: []

# 临时调课：某一天替换掉某节课，格式与 entries 相同
overrides: []
