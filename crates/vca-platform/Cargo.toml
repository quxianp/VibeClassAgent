[package]
name = "vca-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "平台适配层：Windows 采集、进程、会话、硬件探测"

[dependencies]
vca-core.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq = { version = "3.4.2", features = ["json"] }
tungstenite = "0.30.0"
docx-rs = "0.4.22"

[target.'cfg(windows)'.dependencies]
# WASAPI 音频采集（系统回环 + 麦克风）等 Win32 调用。
# 需要 StructuredStorage + Variant：IMMDevice::Activate<T> 的包装方法
# 只在这两个 feature 同时开启时才由 windows crate 生成（见其 mod.rs 的 cfg）。
windows.workspace = true
