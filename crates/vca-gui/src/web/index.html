<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VibeClassAgent</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">VCA</span>
      <span class="brand-sub">课堂录制与总结</span>
    </div>

    <nav class="nav" id="nav">
      <button class="nav-item active" data-page="overview">
        <span class="nav-ico">◈</span> 概览
      </button>
      <button class="nav-item" data-page="model">
        <span class="nav-ico">✦</span> 模型 API
      </button>
      <button class="nav-item" data-page="push">
        <span class="nav-ico">⇪</span> 推送
      </button>
      <button class="nav-item" data-page="timetable">
        <span class="nav-ico">▤</span> 时间表
      </button>
      <button class="nav-item" data-page="schedule">
        <span class="nav-ico">▦</span> 课表
      </button>
      <button class="nav-item" data-page="record">
        <span class="nav-ico">●</span> 录制与文件
      </button>
      <button class="nav-item" data-page="jobs">
        <span class="nav-ico">≡</span> 作业
      </button>
    </nav>

    <div class="sidebar-foot">
      <div class="dot-row"><span class="dot" id="dot-llm"></span> 模型</div>
      <div class="dot-row"><span class="dot" id="dot-push"></span> 推送</div>
      <div class="dot-row"><span class="dot" id="dot-stt"></span> 本地转写</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1 id="page-title">概览</h1>
      <div class="topbar-right">
        <span class="pill" id="pill-profile">default</span>
        <button class="btn ghost" id="btn-refresh">刷新</button>
        <button class="btn ghost" id="btn-quit"
                title="退出程序。注意：直接关掉这个窗口不会退出后台服务。">退出</button>
      </div>
    </header>
    <section class="content" id="view"></section>
  </main>
</div>

<div class="toast-wrap" id="toasts"></div>
<script src="/app.js"></script>
</body>
</html>
