[package]
name = "vca-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "平台适配层：Windows 采集、进程、会话、硬件探测"

[dependencies]
vca-core.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq = { version = "3.4.2", features = ["json"] }
# zip：解压 NapCat 的发布包（标准 deflate，够用）。
# 默认特性一律关掉：zip 8 的 default 会拉进 aes / bzip2 / lzma / zstd / xz
# 一堆本机依赖缓存里压根没有的 crate，离线构建直接失败。
# deflate-flate2 走纯 Rust 的 miniz_oxide，与依赖树里已有的那份一致。
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
# 企业微信「智能机器人」走 WebSocket，所以要 TLS。
# 选 webpki-roots 而不是 native-roots：前者是 ring + 内置根证书，
# 与 ureq 那条链上已有的 rustls/ring/webpki-roots 是同一份，不新增 crate。
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
# 钉钉 / 飞书这类机器人要在本地算 HMAC-SHA256 签名。
# 版本跟缓存里已有的 digest 0.11 一代对齐（sha2 0.11 / hmac 0.13），
# 免得同一套 RustCrypto 被编两份。
hmac = "0.13"
sha2 = "0.11"
base64 = "0.22"
docx-rs = "0.4.22"
# png：摘要卡片要存 PNG（企业微信群机器人的图片消息认 png/jpg）。
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(windows)'.dependencies]
# WASAPI 音频采集（系统回环 + 麦克风）等 Win32 调用。
# 需要 StructuredStorage + Variant：IMMDevice::Activate<T> 的包装方法
# 只在这两个 feature 同时开启时才由 windows crate 生成（见其 mod.rs 的 cfg）。
windows.workspace = true
